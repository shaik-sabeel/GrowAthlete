                <x-top-bar-content slot="headerbar" dir="ltr"><template shadowrootmode="open"><!----><!--?lit$693147956$--><div id="top-bar-content"><top-app-bar-content features="" data-is-programmatic="false" toggle="true"><template shadowrootmode="open">
    <style>
    :host {
      display: block;
      opacity: 1;
      transition: opacity 0.2s ease-in-out;
      font-family: adobe-clean;
    }
    
    :host([toggle="true"]) {
      opacity: 1;
    }

    :host([toggle="true"]) .top-app-bar-content-container {
      height: 3.5rem;
      opacity: 1;
    }

    :host([toggle="false"]) {
      opacity: 0;
    }

    :host([toggle="false"]) .top-app-bar-content-container {
      height: 0;
      opacity: 0;
    }
    
    .top-app-bar-content-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transition: height 0.2s ease-in-out, opacity 0.2s ease-in-out;
      height: 3.5rem;
      opacity: 1;
      background-size: 100% 100%;
      &::after {
        height: 100%;
        width: 3rem;
        content: '';
        opacity: 0;
      }
    }
    
    .top-app-bar-toggle-container {
      display: flex;
      padding: 0.75rem 0 0.75rem 1rem;
      align-items: center;
      .top-app-bar-toggle {
        display: flex;
        cursor: pointer;
        :hover {
          border-radius: 0.5rem;
          background: rgba(255, 255, 255, 0.14);
        }
      }
    }
  
    .top-app-bar-toggle-container .top-app-bar-toggle svg {
      height: 1.25rem;
      width: 1.25rem;
      fill: rgba(255, 255, 255, 0.85);
      padding: 0.375rem;
    }
    .top-app-bar-apps {
      > ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
    }
    .top-app-bar-apps {
      display: flex;
      height: 100%;
      justify-content: center;
      align-items: center;
      &:has(.divider-active) {
        gap: 0.375rem;
      }
      .top-app-bar-app-tiles {
        display: flex;
        height: 100%;
        gap: 0.375rem;
        .top-app-bar-app-tile {
          .top-app-bar-app-tile-button {
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 0.468rem 0;
            gap: 0.125rem;
            text-decoration: none;
            width: 5rem;
            position: relative;
          }
          transition: width 0.3s ease-in, opacity 0.3s ease-in;
          &.draggable-tile {
            user-drag: element;
            -webkit-user-drag: element;
          }
          & * {
            user-drag: none;
            -webkit-user-drag: none;
          } 
          .top-app-bar-app-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 1.438rem;
            width: 1.5rem;
            & img {
              display: flex;
              box-sizing: border-box;
              width: 100%;
              height: 100%;
            }
          }
          .top-app-bar-app-name {
            display: flex;
            font-weight: 500;
            font-size: 0.75rem;
            color: rgba(248, 248, 248, 1);
            font-style: normal;
            width: 5rem;
            height: 1rem;
            justify-content: center;
            align-items: center;
            line-height: 130%;
            text-align: center;
            &::after {
              content: '';
              position: absolute;
              bottom: 0.25rem;
              width: 1rem;
              height: 0.125rem;
              background-color: rgba(255, 255, 255, 1);
              border-radius: 0.125rem;
              transition: opacity 0.2s ease-in;
              opacity: 0;
            }
          }
          &.dragging {
            z-index: 10000;
            .top-app-bar-app-name {
              color: rgba(0, 0, 0, 0);
            }
          }
          &.long-pressed-tile {
            .top-app-bar-app-name::after {
              width: 1.25rem;
            }
          }
        }
      }
    }
    .top-app-bar-apps:not(.drag-active) {
      .top-app-bar-app-tile:hover .top-app-bar-app-name:not(.app-selected)::after {
        opacity: 0.5;
      }
      .top-app-bar-app-name.app-selected::after {
        opacity: 1;
      }
    }
    .top-app-bar-app-tile-button:focus-visible {
      box-shadow: inset 0 0 0 2px #507BFF;
      outline: none;
      border-radius: 0.25rem;
    }
    .top-app-bar-apps:focus-visible,
    .top-app-bar-toggle:focus-visible {
      outline: 2px solid #507BFF;
      border-radius: 0.25rem;
    }
    .top-app-bar-divider {
      display: flex;
      width: 0;
      opacity: 0;
      height: 1.25rem;
      background: rgba(255, 255, 255, 1);
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      transition: width 0.3s ease-in, opacity 0.3s ease-in, margin 0.3s ease-in;
      margin-left: 0.375rem;
      &.divider-active {
        width: 0.063rem;
        opacity: 0.64;
        margin-right: 0.375rem;
      }
    }
    .top-app-bar-close-icon {
      width: 1.125rem;
      height: 1.125rem;
      position: absolute;
      top: 0.188rem;
      left: 50%;
      opacity: 0;
      transition: opacity 0.3s ease-in;
      line-height: normal;
    }
    .top-app-bar-apps:not(.drag-active) .top-app-bar-app-tile:hover .top-app-bar-close-icon {
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0,-1.2,1,1);
    }
    .top-app-bar-drag-image {
      position: absolute;
      top: -100px;
      left: -100px;
      opacity: 0;
      pointer-events: none;
    }
  </style>

.profile-container {

  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;

  outline: none;
}
.profile-container .profile-dropdown {
  background-color: #fff;

.profile-container-popover .profile-dropdown {

  position: absolute;

  top: 100%;
  margin-top: 8px;
  border-radius: 10px;
  overflow-x: hidden;
  overflow-y: auto;

  transform: translate3d(0,0,0);
}

.profile-container-tray .profile-dropdown {
  width: 100%;
  max-width: 600px;
  height: calc(100vh - 100px - var(--account-menu-tray-bottom-spacing)) !important;
  padding-bottom: var(--account-menu-tray-bottom-spacing, 0px);
  transition: opacity 0.13s cubic-bezier(0.5, 0, 1, 1) 0s, transform 0.13s cubic-bezier(0.5, 0, 1, 1) 0s;
  outline: none;
  flex-direction: column;
  display: flex;
  position: absolute;
  bottom: 0;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  pointer-events: auto;
  visibility: visible;
}

@supports (max-height: 100dvh) {
  .profile-container-popover .profile-dropdown {
    max-height: calc(100dvh - var(--account-menu-top-position));
  }
}

.profile-container-tray .profile-wrapper {
  pointer-events: none;
  z-index: 2;
  justify-content: center;
  width: 100%;
  height: 100vh;
  display: flex;
  position: fixed;
  top: 0;
  left: 0;
}
.profile-container-tray .profile-overlay {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  transition: opacity 0.19s cubic-bezier(0.5, 0, 1, 1) 0.16s, visibility 0s linear calc(0.16s + 0.19s);
  position: fixed;
  inset: 0;
  overflow: hidden;
  background-color: #0006;
}
.profile-container-tray .profile.profile-expanded .profile-overlay {
  transition: opacity 0.3s cubic-bezier(0, 0, 0.4, 1) 0s;
  visibility: visible;
  opacity: 1;
  transition-delay: 0s;
}

.account-menu-loading-error {
  display: none;
  margin: 16px;
}

.profile-container .profile-dropdown-dark {
  background-color: #222222;
}
.profile-thumbnail-medium {
  width: 24px;
  height: 24px;
}
.profile-thumbnail-large {
  width: 30px;
  height: 30px;
}
.profile-dropdown-dark .account-menu-loading-error {
  color: #ebebeb;
}
.profile-container-medium {
  width: 32px;
  height: 32px;
}
.profile-container-large {
  width: 40px;
  height: 40px;
}
.profile-container.profile-collapsed:not(:has(.profile-dropdown:hover)):hover {
  background-color: var(--account-menu-light-avatar-hover-background-color);
}

.profile-container.profile-expanded:not(.profile-container-tray) {
  background-color: var(--account-menu-light-avatar-press-background-color);
}

.profile-container:focus-within:has(.profile-thumbnail:focus-visible) {
  outline: 2px solid var(--account-menu-light-avatar-focus-outline-color);
  background-color: var(--account-menu-light-avatar-hover-background-color);
}

.profile-container-dark.profile-collapsed:not(:has(.profile-dropdown:hover)):hover {
  background-color: var(--account-menu-dark-avatar-hover-background-color);
}

.profile-container-dark.profile-expanded:not(.profile-container-tray) {
  background-color: var(--account-menu-dark-avatar-press-background-color);
}

.profile-container-dark:focus-within:has(.profile-thumbnail:focus-visible) {
  outline: 2px solid var(--account-menu-dark-avatar-focus-outline-color);
  background-color: var(--account-menu-dark-avatar-hover-background-color);
}

.profile-container-popover .profile.profile-hidden .profile-dropdown {
  display: none;
}
.profile-container-popover .profile.profile-collapsed .profile-dropdown {
  animation: profile-collapsed .2s ease 0s 1 both;
}
.profile-container-popover .profile.profile-expanded .profile-dropdown {
  animation: profile-expanded .2s ease 0s 1 both;
}
.profile-container-tray .profile.profile-hidden .profile-dropdown {
  visibility: hidden;
  transform: translateY(100%);
}
.profile-container-tray .profile.profile-collapsed .profile-dropdown {
  transform: translateY(200%);
}
.profile-container-tray .profile.profile-expanded .profile-dropdown {
  transition: transform 0.25s cubic-bezier(0, 0, 0.4, 1) 0.16s, opacity 0.25s cubic-bezier(0, 0, 0.4, 1) 0.16s;
  transform: translateY(0);
}
@keyframes profile-collapsed {
  0% {
    opacity: 1
  }

  100% {
    opacity: 0
  }
}
@keyframes profile-expanded {
  0% {
    opacity: 0
  }

  100% {
    opacity: 1
  }
}
</style>
